[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
scb-syntax = { path = "crates/scb-syntax" }
scb-types = { path = "crates/scb-types" }
scb-runtime = { path = "crates/scb-runtime" }
scb-stdlib = { path = "crates/scb-stdlib" }
unicode-segmentation = "1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"
