# Site for the SCB CGI example in the Docker image (/etc/nginx/conf.d/scb.conf).

server {
    listen 80 default_server;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    # The demo page.
    root /srv/scb/cgi/public;
    index index.html;

    # The SCB handler: one `scb run` per request, through fcgiwrap.
    location = /scb {
        gzip off;
        include fastcgi_params;
        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.sock;
        fastcgi_param SCRIPT_FILENAME /srv/scb/cgi/handler.cgi;
    }
}
