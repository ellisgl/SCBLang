# NGINX server block for the SCB CGI smoke test (POC milestone M8).
# Requires fcgiwrap (e.g. `apt install fcgiwrap`; socket at /run/fcgiwrap.socket).
# Install: copy handler.scb and handler.cgi to /srv/scb/cgi/, chmod +x handler.cgi.

server {
    listen 8080;
    server_name localhost;

    location /scb {
        gzip off;
        include fastcgi_params;
        fastcgi_pass unix:/run/fcgiwrap.socket;
        fastcgi_param SCRIPT_FILENAME /srv/scb/cgi/handler.cgi;
    }
}

# Checks (automated, without installing anything: examples/cgi/smoke-test.sh):
#   curl -i 'http://localhost:8080/scb?x=1'          -> 200, method GET, query x=1
#   curl -i -d 'hello' 'http://localhost:8080/scb'   -> 200, method POST, body bytes: 5
#   curl -i 'http://localhost:8080/scb?created'      -> 201 (Status header from the script)
#   curl -i 'http://localhost:8080/scb?fail'         -> 200 with headers and a truncated body: the
#                                                       echoed output is flushed, then the trace goes
#                                                       to stderr (NGINX error log) and scb exits 1
#   curl -i 'http://localhost:8080/scb?fail-early'   -> 502: no output before the throw; trace in the
#                                                       error log
